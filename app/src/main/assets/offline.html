<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Self Evolve</title>
<style>
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(160deg,#0d1b16,#0a0f0d);color:#e8f5ef;font-family:system-ui,-apple-system,sans-serif;padding:24px;box-sizing:border-box;text-align:center}
  .logo{width:72px;height:72px;border-radius:20px;background:linear-gradient(135deg,#10a37f,#09765c);display:flex;align-items:center;justify-content:center;margin-bottom:20px}
  h1{font-size:18px;margin:0 0 8px;font-weight:600}
  p{font-size:14px;color:#9fb8ad;margin:0 0 24px;line-height:1.6}
  button{background:linear-gradient(135deg,#10a37f,#09765c);color:#fff;border:0;border-radius:12px;padding:12px 40px;font-size:15px;font-weight:600;cursor:pointer}
  button:active{opacity:.85}
  #tip{margin-top:16px;font-size:12px;color:#6f8a80}
</style>
</head>
<body>
<div class="logo">
  <svg width="36" height="36" viewBox="0 0 24 24" fill="none"><path d="M3 17l6-6 4 4 8-8" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M15 7h6v6" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
</div>
<h1>服务暂时无法连接</h1>
<p>可能是网络不可用，或服务端暂时下线。<br>请检查网络后重试。</p>
<button onclick="document.getElementById('tip').textContent='正在重试…';app.retry()">重试</button>
<p id="tip"></p>
</body>
</html>
